name: Eaglercraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download server
        run: |
          wget -O server.zip \
            https://github.com/rapidSpeed4652/Eaglercraft-Server/releases/latest/download/server.zip

          unzip -q server.zip
          rm server.zip

          echo "Server files:"
          ls -la server/

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install cloudflared
        run: |
          wget -O cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared
          ./cloudflared --version

      - name: Start Minecraft server
        working-directory: server
        run: |
          echo "eula=true" > eula.txt
          mkfifo minecraft-console

          java -Xms1G -Xmx4G \
            -jar paper-1.12.2-1620.jar nogui \
            < minecraft-console \
            > server.log 2>&1 &

          echo $! > server.pid

          exec 3>minecraft-console

      - name: Wait for Minecraft server
        working-directory: server
        run: |
          echo "Waiting for Minecraft server..."

          for i in {1..120}; do
            if grep -q "Done (" server.log; then
              echo "Minecraft server is ready!"
              break
            fi

            sleep 2
          done

          echo ""
          echo "========== MINECRAFT SERVER LOG =========="
          cat server.log
          echo "==========================================="

          if ! grep -q "Done (" server.log; then
            echo "Minecraft server failed to start."
            exit 1
          fi

      - name: Start Cloudflare Tunnel
        run: |
          ./cloudflared tunnel \
            --url http://127.0.0.1:25565 \
            > cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "Waiting for Cloudflare tunnel..."

          for i in {1..60}; do
            URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              cloudflared.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2
          done

          echo ""
          echo "========== CLOUDFLARE LOG =========="
          cat cloudflared.log
          echo "===================================="

          if [ -z "$URL" ]; then
            echo "Cloudflare tunnel failed to start."
            cat clourdflared.log
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       EAGLERCRAFT SERVER ADDRESS"
          echo "=========================================="
          echo ""
          echo "wss://${URL#https://}"
          echo ""
          echo "=========================================="

          echo "CLOUDFLARED_PID=$CLOUDFLARED_PID" >> "$GITHUB_ENV"

      - name: Save Minecraft server
        if: always()
        run: |
          echo "Saving Minecraft server..."
            rm -f server.zip

          if [ -f server/server.pid ]; then
            PID=$(cat server/server.pid)
            zip -qr server.zip server/

            if kill -0 "$PID" 2>/dev/null; then
              echo "Sending stop command..."
            echo "New server.zip created:"
            ls -lh server.zip

              echo "stop" > server/stop-command
            echo ""
            echo "=========================================="
            echo "Uploading updated world..."
            echo "=========================================="

            TAG=$(gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName')

            if [ -z "$TAG" ]; then
              echo "ERROR: No GitHub Release found."
              exit 1
            fi

              # Send the command through the server's stdin.
              # Paper must receive the actual console command.
              kill -TERM "$PID" 2>/dev/null || true
            echo "Using release: $TAG"

              sleep 10
            fi
          fi